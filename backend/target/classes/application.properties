# Server Configuration
server.port=${PORT:8080}

# MySQL Database Configuration using Environment / Configuration Variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/unicore_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security & JWT Token Configuration
unicore.jwt.secret=${JWT_SECRET:9a4f2c8d3e5b7a1f6c8d2e4a7b9c1d3f5e7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c}
unicore.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seed Admin Credentials (overridable via environment variables)
unicore.admin.id=${ADMIN_ID:ADMIN-001}
unicore.admin.name=${ADMIN_NAME:System Administrator}
unicore.admin.email=${ADMIN_EMAIL:admin@unicore.edu}
unicore.admin.password=${ADMIN_PASSWORD:Admin@UniCore2026}
unicore.admin.department=${ADMIN_DEPARTMENT:Administration}

# ML Inference Engine Configuration
unicore.ml.python-path=${PYTHON_PATH:python}
unicore.ml.model-dir=${ML_MODEL_DIR:../ML/models}
unicore.ml.timeout-seconds=${ML_TIMEOUT_SECONDS:8}
